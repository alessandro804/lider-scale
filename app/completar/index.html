<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Complete seu cadastro · Lider Scale</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css">
<style>
/* ★★★ Mesma pele do login: quem acabou de entrar pelo Google nao pode
   sentir que caiu em outro sistema no meio do caminho. */
body{ display:flex; align-items:center; justify-content:center; padding:24px; min-height:100vh; }
.caixa{
  width:100%; max-width:470px;
  background: var(--superficie); border:1px solid var(--borda);
  border-radius: var(--raio-g); padding:34px 32px;
  box-shadow: 0 18px 50px rgba(0,0,0,.42);
}
.marca{ display:flex; align-items:center; gap:11px; margin-bottom:24px; }
.marca img{ width:36px; height:36px; border-radius:9px; }
.marca span{ font-size:18px; font-weight:750; letter-spacing:-.02em; }
.marca span i{ font-style:normal; color: var(--violeta-300); }
h1{ font-size:21px; font-weight:730; letter-spacing:-.025em; margin-bottom:7px; }
.sub{ font-size:14px; color: var(--texto-2); line-height:1.55; margin-bottom:24px; }
.dupla{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:460px){ .dupla{ grid-template-columns:1fr; } }
#btnSalvar{ margin-top:8px; }
.rodape{ margin-top:18px; text-align:center; font-size:12.5px; color: var(--texto-3); }
.rodape a{ color: var(--violeta-300); }
</style>
</head>
<body>

<div class="caixa">
  <div class="marca">
    <img src="../assets/logo-128.png" alt="">
    <span>Lider <i>Scale</i></span>
  </div>

  <h1>Falta pouco, <span id="primeiroNome">tudo certo</span></h1>
  <p class="sub">
    Precisamos de mais tres informacoes para emitir suas propostas e contratos
    no nome certo. Leva menos de um minuto.
  </p>

  <div id="aviso"></div>

  <form id="forma" novalidate>
    <div class="campo">
      <label for="empresa">Nome da sua empresa</label>
      <input type="text" id="empresa" autocomplete="organization"
             placeholder="Como aparece na nota fiscal" required>
    </div>

    <div class="dupla">
      <div class="campo">
        <label for="documento">CPF ou CNPJ</label>
        <input type="text" id="documento" inputmode="numeric"
               placeholder="00.000.000/0000-00" required>
      </div>
      <div class="campo">
        <label for="telefone">Celular com DDD</label>
        <input type="tel" id="telefone" inputmode="numeric"
               autocomplete="tel" placeholder="(31) 99999-9999" required>
      </div>
    </div>

    <button type="submit" class="btn btn-principal btn-bloco" id="btnSalvar">
      Comecar a usar
    </button>
  </form>

  <div class="rodape">
    Nao e voce? <a href="#" id="sair">Entrar com outra conta</a>
  </div>
</div>

<script src="../assets/sessao.js"></script>
<script>
'use strict';
if (!Sessao.exigir()) throw new Error('sem sessao');

const el = (id) => document.getElementById(id);
const usuario = Sessao.usuario();

el('primeiroNome').textContent = (usuario.nome || '').split(' ')[0] || 'tudo certo';

/* ── as mascaras, iguais as do login ──────────────────────────────────── */
function so(v){ return String(v || '').replace(/\D/g, ''); }

function mascaraDocumento(v){
  const d = so(v).slice(0, 14);
  if (d.length <= 11) {
    return d.replace(/(\d{3})(\d)/, '$1.$2')
            .replace(/(\d{3})(\d)/, '$1.$2')
            .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
  }
  return d.replace(/^(\d{2})(\d)/, '$1.$2')
          .replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3')
          .replace(/\.(\d{3})(\d)/, '.$1/$2')
          .replace(/(\d{4})(\d{1,2})$/, '$1-$2');
}

function mascaraTelefone(v){
  const d = so(v).slice(0, 11);
  if (d.length <= 10) return d.replace(/^(\d{2})(\d)/, '($1) $2').replace(/(\d{4})(\d{1,4})$/, '$1-$2');
  return d.replace(/^(\d{2})(\d)/, '($1) $2').replace(/(\d{5})(\d{1,4})$/, '$1-$2');
}

el('documento').addEventListener('input', function(){ this.value = mascaraDocumento(this.value); });
el('telefone').addEventListener('input', function(){ this.value = mascaraTelefone(this.value); });

/* ── avisos: erro em vermelho, numa caixa so dele ─────────────────────── */
function erro(texto){
  el('aviso').innerHTML =
    '<div class="aviso aviso-erro">' +
      '<svg class="ico" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">' +
        '<circle cx="12" cy="12" r="10"></circle><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>' +
      '<span>' + texto + '</span></div>';
  el('aviso').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function limparAviso(){ el('aviso').innerHTML = ''; }

el('forma').addEventListener('submit', async function (e) {
  e.preventDefault();
  limparAviso();

  const empresa = el('empresa').value.trim();
  const documento = so(el('documento').value);
  const telefone = so(el('telefone').value);

  /* ★★★ a conferencia daqui e so para a pessoa nao esperar a ida ate o
     servidor. Quem decide de verdade e o servidor, que confere o digito. */
  if (empresa.length < 2)  return erro('Informe o nome da sua empresa.');
  if (documento.length !== 11 && documento.length !== 14)
    return erro('O CPF tem 11 numeros e o CNPJ tem 14. Confira o que foi digitado.');
  if (telefone.length < 10) return erro('Informe o celular com DDD, no formato (31) 99999-9999.');

  const botao = el('btnSalvar');
  botao.disabled = true;
  botao.innerHTML = '<span class="girando"></span> Salvando';

  try {
    await chamar('/cadastro/completar', {
      method: 'POST',
      body: JSON.stringify({ empresa, documento, telefone }),
    });
    window.location.href = '../';
  } catch (ex) {
    botao.disabled = false;
    botao.textContent = 'Comecar a usar';
    erro(ex.message);
  }
});

el('sair').addEventListener('click', async function (e) {
  e.preventDefault();
  try { await chamar('/auth/sair', { method: 'POST' }); } catch (ex) {}
  Sessao.limpar();
  window.location.href = '../login/';
});
</script>
</body>
</html>
