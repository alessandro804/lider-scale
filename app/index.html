<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lider Scale</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   O PAINEL · mesmo esqueleto do Lider 10, pele escura
   ═══════════════════════════════════════════════════════════════════════════
   ★★★★ CADA TELA E UM ARQUIVO, CARREGADO SO QUANDO ABRE. O painel do Lider 10
   tem 4,9 MB num arquivo so, contra um teto de 7 MB, e cada tela nova chega
   mais perto da parede. Aqui o index fica magro desde o primeiro dia.
   ═══════════════════════════════════════════════════════════════════════════ */
body{ display:flex; min-height:100vh; }

/* ── barra lateral ── */
.sidebar{
  width: var(--lateral); flex:0 0 auto;
  background: var(--superficie); border-right:1px solid var(--borda);
  display:flex; flex-direction:column; position:fixed; top:0; left:0; height:100vh; z-index:20;
}
.sb-marca{ display:flex; align-items:center; gap:11px; padding:20px 18px 18px; }
.sb-marca img{ width:34px; height:34px; border-radius:9px; }
.sb-marca span{ font-size:17px; font-weight:750; letter-spacing:-.02em; }
.sb-marca span i{ font-style:normal; color: var(--violeta-300); }

.sb-menu{ flex:1; padding:6px 10px; overflow-y:auto; }
.sb-item{
  display:flex; align-items:center; gap:11px;
  padding:10px 12px; border-radius:var(--raio-p); margin-bottom:2px;
  color: var(--texto-2); font-size:14px; font-weight:550; cursor:pointer;
  transition: var(--transicao); border:1px solid transparent;
}
.sb-item:hover{ background: var(--superficie-2); color: var(--texto); }
.sb-item.ativo{
  background: linear-gradient(97deg, rgba(120,44,251,.18), rgba(120,44,251,.06));
  color: var(--texto); border-color: rgba(120,44,251,.3);
}
.sb-item.ativo svg{ color: var(--violeta-300); }
.sb-item svg{ flex:0 0 auto; }
.sb-grupo{
  font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color: var(--texto-3); padding:16px 12px 7px;
}
.sb-rodape{ padding:12px 10px; border-top:1px solid var(--borda); }

/* ── barra do topo ── */
.conteudo{ flex:1; margin-left: var(--lateral); display:flex; flex-direction:column; min-width:0; }
.topo{
  background: rgba(10,6,18,.85); backdrop-filter: blur(10px);
  border-bottom:1px solid var(--borda);
  padding:13px 26px; display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:10;
}
.topo h1{ font-size:19px; font-weight:700; letter-spacing:-.02em; }
.topo-dir{ display:flex; align-items:center; gap:14px; }
.pessoa{ display:flex; align-items:center; gap:10px; }
.pessoa .bolha{
  width:34px; height:34px; border-radius:50%;
  background: linear-gradient(135deg, var(--violeta), var(--violeta-800));
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700; color:#fff;
}
.pessoa .quem{ font-size:13.5px; font-weight:600; line-height:1.3; }
.pessoa .papel{ font-size:11.5px; color: var(--texto-3); }

.area{ padding:26px; max-width:1360px; width:100%; margin:0 auto; flex:1; }

/* ── faixa da cortesia ── */
.faixa-cortesia{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  background: linear-gradient(120deg, rgba(120,44,251,.16), rgba(67,19,150,.09));
  border:1px solid rgba(120,44,251,.32); border-radius: var(--raio);
  padding:15px 19px; margin-bottom:22px;
}
.faixa-cortesia .dias{
  font-size:25px; font-weight:800; color: var(--violeta-200); line-height:1;
  font-variant-numeric: tabular-nums;
}
.faixa-cortesia .frase{ flex:1; min-width:260px; font-size:14px; line-height:1.5; }
.faixa-cortesia .frase strong{ color: var(--violeta-100); }

/* ── cartoes de numero ── */
.grade{ display:grid; grid-template-columns: repeat(auto-fit, minmax(224px, 1fr)); gap:15px; margin-bottom:22px; }
.metrica{ background: var(--superficie); border:1px solid var(--borda); border-radius: var(--raio); padding:17px 19px; }
.metrica .rot{ font-size:12px; color: var(--texto-3); text-transform:uppercase; letter-spacing:.06em; font-weight:650; margin-bottom:9px; }
.metrica .val{ font-size:27px; font-weight:750; letter-spacing:-.03em; line-height:1; }
.metrica .pe{ font-size:12.5px; color: var(--texto-3); margin-top:7px; }

/* ── passos ── */
.passo{
  display:flex; gap:14px; align-items:flex-start;
  padding:15px 0; border-bottom:1px solid var(--borda);
}
.passo:last-child{ border-bottom:none; }
.passo .n{
  width:27px; height:27px; border-radius:50%; flex:0 0 auto;
  background: var(--superficie-3); border:1px solid var(--borda-forte);
  display:flex; align-items:center; justify-content:center;
  font-size:12.5px; font-weight:700; color: var(--texto-2);
}
.passo.feito .n{ background: var(--verde-leve); border-color: rgba(47,214,127,.4); color: var(--verde); }
.passo .tit{ font-size:14.5px; font-weight:600; margin-bottom:3px; }
.passo .sub{ font-size:13px; color: var(--texto-2); line-height:1.5; }

@media (max-width: 900px){
  .sidebar{ transform: translateX(-100%); transition: var(--transicao); }
  .sidebar.aberta{ transform:none; }
  .conteudo{ margin-left:0; }
  .area{ padding:18px; }
}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sb-marca">
    <img src="assets/logo-128.png" alt="">
    <span>Lider <i>Scale</i></span>
  </div>

  <nav class="sb-menu" id="menu"></nav>

  <div class="sb-rodape">
    <div class="sb-item" id="btnSair">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path>
      </svg>
      Sair
    </div>
  </div>
</aside>

<div class="conteudo">
  <header class="topo">
    <h1 id="tituloTela">Inicio</h1>
    <div class="topo-dir">
      <div class="pessoa">
        <div class="bolha" id="iniciais">..</div>
        <div>
          <div class="quem" id="nomePessoa">Carregando</div>
          <div class="papel" id="papelPessoa">&mdash;</div>
        </div>
      </div>
    </div>
  </header>

  <main class="area" id="area">
    <div class="esqueleto" style="height:84px;margin-bottom:22px"></div>
    <div class="grade">
      <div class="esqueleto" style="height:108px"></div>
      <div class="esqueleto" style="height:108px"></div>
      <div class="esqueleto" style="height:108px"></div>
      <div class="esqueleto" style="height:108px"></div>
    </div>
  </main>
</div>

<script src="assets/sessao.js"></script>
<script>
'use strict';

/* ★★★★ A PRIMEIRA COISA, ANTES DE DESENHAR QUALQUER PIXEL: tem sessao? Sem
   isto, quem abre o endereco direto ve a estrutura da tela por um instante
   antes de ser mandado embora, e tela que pisca parece sistema quebrado. */
if (!Sessao.exigir()) throw new Error('sem sessao');

const el = (id) => document.getElementById(id);
const usuario = Sessao.usuario();

const PAPEL_NA_TELA = {
  super_adm: 'Super ADM',
  dono: 'Dono da conta',
  gestor: 'Gestor',
  closer: 'Closer',
  sdr: 'SDR',
};

/* ── o menu depende do papel ─────────────────────────────────────────────
   ★★★ A tela esconder o item NAO e a protecao: quem decide e o servidor, a
   cada chamada. Isto aqui e so para a pessoa nao ver porta que nao abre. */
const MENU = [
  { grupo: 'Comercial' },
  { id:'inicio',        nome:'Inicio',        papeis:'*' },
  { id:'oportunidades', nome:'Oportunidades', papeis:'*' },
  { id:'propostas',     nome:'Propostas',     papeis:'*' },
  { grupo: 'Configuracao' },
  { id:'catalogo',      nome:'Catalogo',      papeis:['super_adm','dono','gestor'] },
  { id:'comissoes',     nome:'Comissoes',     papeis:['super_adm','dono','gestor'] },
  { id:'equipe',        nome:'Equipe',        papeis:['super_adm','dono'] },
  { grupo: 'Plataforma', papeis:['super_adm'] },
  { id:'contas',        nome:'Contas',        papeis:['super_adm'] },
  { id:'planos',        nome:'Planos',        papeis:['super_adm'] },
  { id:'tickets',       nome:'Tickets',       papeis:['super_adm'] },
  { id:'disparos',      nome:'Mensagens',     papeis:['super_adm'] },
  { id:'saude',         nome:'Saude',         payeis:null, papeis:['super_adm'] },
];

const ICONES = {
  inicio:'<path d="M3 11l9-8 9 8"></path><path d="M5 10v10h14V10"></path>',
  oportunidades:'<path d="M3 6h18"></path><path d="M7 12h10"></path><path d="M10 18h4"></path>',
  propostas:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path>',
  catalogo:'<path d="M20 7H4"></path><path d="M20 12H4"></path><path d="M20 17H4"></path>',
  comissoes:'<path d="M12 1v22"></path><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>',
  equipe:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>',
  contas:'<path d="M3 21h18"></path><path d="M5 21V7l7-4 7 4v14"></path><path d="M9 21v-6h6v6"></path>',
  planos:'<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><path d="M7 7h.01"></path>',
  tickets:'<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>',
  disparos:'<path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4 20-7z"></path>',
  saude:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>',
};

function montarMenu(){
  const papel = usuario.papel || 'closer';
  let html = '';
  for (const it of MENU) {
    if (it.grupo) {
      if (it.papeis && it.papeis.indexOf(papel) < 0) continue;
      html += '<div class="sb-grupo">' + it.grupo + '</div>';
      continue;
    }
    if (it.papeis !== '*' && it.papeis.indexOf(papel) < 0) continue;
    html += '<div class="sb-item' + (it.id === 'inicio' ? ' ativo' : '') + '" data-tela="' + it.id + '">' +
      '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
      (ICONES[it.id] || '') + '</svg>' + it.nome + '</div>';
  }
  el('menu').innerHTML = html;

  el('menu').querySelectorAll('.sb-item').forEach(function (b) {
    b.addEventListener('click', function () {
      el('menu').querySelectorAll('.sb-item').forEach(x => x.classList.remove('ativo'));
      b.classList.add('ativo');
      abrir(b.dataset.tela, b.textContent.trim());
    });
  });
}

function abrir(tela, titulo){
  el('tituloTela').textContent = titulo || 'Inicio';
  if (tela === 'inicio') return desenharInicio();
  /* ★★ Tela que ainda nao existe diz o que esta por vir, em vez de abrir
     vazia: tela em branco parece defeito, aviso parece plano. */
  el('area').innerHTML =
    '<div class="cartao">' +
      '<div class="cartao-titulo">' + (titulo || tela) + '</div>' +
      '<div class="cartao-sub">Esta tela entra na proxima leva. O que ja esta de pe por tras dela: a conta, os papeis, o catalogo e as regras de comissao.</div>' +
    '</div>';
}

async function desenharInicio(){
  let conta = null;
  try { conta = (await chamar('/cadastro/minha-conta')).conta; } catch (e) { conta = null; }

  // ★★★★ A TELA DE COMPLEMENTO NAO PODE SER PULADA indo direto ao endereco
  //   do painel. Quem entrou pelo Google e fechou aquela tela chega aqui com
  //   a conta sem documento, e proposta sem CNPJ nao vira contrato.
  if (conta && conta.completar) { window.location.href = 'completar/'; return; }

  let faixa = '';
  if (conta && conta.situacao === 'cortesia') {
    faixa =
      '<div class="faixa-cortesia">' +
        '<div class="dias">' + conta.dias_de_cortesia + '</div>' +
        '<div class="frase"><strong>dias de cortesia no plano completo.</strong><br>' +
        'Voce usa o sistema inteiro durante o teste. Para seguir sem parar depois, e so ativar a assinatura.</div>' +
      '</div>';
  } else if (conta && conta.situacao === 'vencida') {
    /* ★★★★ Mensagem de plano abre pelo GANHO, nunca pelo bloqueio, e nunca em
       vermelho: isto nao e falha, e um convite. */
    faixa =
      '<div class="faixa-cortesia">' +
        '<div class="frase"><strong>Seus dados continuam todos aqui.</strong><br>' +
        'Ativando a assinatura, voce volta a montar proposta com sinal no mesmo link, ' +
        'recebe o aviso no WhatsApp quando o dinheiro cair e para de controlar comissao em planilha.</div>' +
      '</div>';
  }

  el('area').innerHTML = faixa +
    '<div class="grade">' +
      metrica('Propostas enviadas', '0', 'nenhuma ainda') +
      metrica('Aguardando aceite',  '0', 'nada parado') +
      metrica('Contratado no mes',  'R$ 0,00', 'nenhuma venda ainda') +
      metrica('Recebido no mes',    'R$ 0,00', 'nenhum pagamento ainda') +
    '</div>' +
    '<div class="cartao">' +
      '<div class="cartao-titulo">Para comecar</div>' +
      '<div class="cartao-sub">Tres passos ate a primeira proposta no ar.</div>' +
      passo(1, true,  'Conta criada', 'Sua conta esta ativa e voce e o dono dela.') +
      passo(2, false, 'Monte seu catalogo', 'Cadastre o que voce vende, com preco, sinal e as etapas de entrega. A conta nasce vazia de proposito, para o catalogo ser o seu.') +
      passo(3, false, 'Crie a equipe', 'Convide gestor, closer e SDR. Cada um enxerga so o que lhe diz respeito.') +
    '</div>';
}

function metrica(rot, val, pe){
  return '<div class="metrica"><div class="rot">' + rot + '</div>' +
         '<div class="val num">' + val + '</div><div class="pe">' + pe + '</div></div>';
}
function passo(n, feito, tit, sub){
  return '<div class="passo' + (feito ? ' feito' : '') + '">' +
    '<div class="n">' + (feito ? '&#10003;' : n) + '</div>' +
    '<div><div class="tit">' + tit + '</div><div class="sub">' + sub + '</div></div></div>';
}

/* ── a pessoa no topo ── */
(function cabecalho(){
  const nome = usuario.nome || 'Usuario';
  el('nomePessoa').textContent = nome;
  el('papelPessoa').textContent = PAPEL_NA_TELA[usuario.papel] || usuario.papel || '';
  el('iniciais').textContent = nome.split(/\s+/).slice(0,2).map(p => p[0] || '').join('').toUpperCase() || '?';
})();

el('btnSair').addEventListener('click', async function () {
  try { await chamar('/auth/sair', { method:'POST' }); } catch (e) {}
  Sessao.limpar();
  window.location.href = '/app/login/';
});

montarMenu();
desenharInicio();
</script>
</body>
</html>
